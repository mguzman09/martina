<body>

<h1>Don Bosco Theater Booking</h1>

<!-- SCREEN 1 -->

<div id="screen1" class="screen active">
  <h2>Enter Ticket Details</h2>

<label>Adults:</label> <input type="number" id="adults" min="0" value="0"><br>

<label>Children:</label> <input type="number" id="children" min="0" value="0"><br>

  <div class="nav">
    <div></div>
    <button onclick="goToSeats()">Next</button>
  </div>
</div>

<!-- SCREEN 2 -->

<div id="screen2" class="screen">
  <h2>Select Your Seats</h2>
  <div class="container" id="seating"></div>

  <div class="nav">
    <button onclick="goBack()">Back</button>
    <button onclick="confirmBooking()">Next</button>
  </div>
</div>

<!-- SCREEN 3 -->

<div id="screen3" class="screen">
  <h2>Booking Summary</h2>
  <p id="summary"></p>

  <div class="nav">
    <button onclick="goBackSeats()">Back</button>
    <div></div>
  </div>
</div>

<script>
  const seatPriceAdult = 10;
  const seatPriceChild = 5;

  function goToSeats() {
    document.getElementById("screen1").classList.remove("active");
    document.getElementById("screen2").classList.add("active");
  }

  function goBack() {
    document.getElementById("screen2").classList.remove("active");
    document.getElementById("screen1").classList.add("active");
  }

  function goBackSeats() {
    document.getElementById("screen3").classList.remove("active");
    document.getElementById("screen2").classList.add("active");
  }

  // Create seats
  const seating = document.getElementById("seating");
  const rows = 5;
  const cols = 8;

  for (let i = 0; i < rows; i++) {
    let row = document.createElement("div");
    row.classList.add("row");

    for (let j = 0; j < cols; j++) {
      let seat = document.createElement("div");
      seat.classList.add("seat");

      seat.addEventListener("click", () => {
        if (!seat.classList.contains("booked")) {
          seat.classList.toggle("selected");
        }
      });

      row.appendChild(seat);
    }

    seating.appendChild(row);
  }

  function confirmBooking() {
    let selectedSeats = document.querySelectorAll(".seat.selected");
    let adults = parseInt(document.getElementById("adults").value) || 0;
    let children = parseInt(document.getElementById("children").value) || 0;

    let totalPeople = adults + children;

    if (selectedSeats.length !== totalPeople) {
      alert("Number of seats must match number of people!");
      return;
    }

    let totalPrice = (adults * seatPriceAdult) + (children * seatPriceChild);

    selectedSeats.forEach(seat => {
      seat.classList.remove("selected");
      seat.classList.add("booked");
    });

    document.getElementById("summary").innerText =
      "Adults: " + adults +
      "\nChildren: " + children +
      "\nTotal Price: $" + totalPrice;

    document.getElementById("screen2").classList.remove("active");
    document.getElementById("screen3").classList.add("active");
  }
</script>

</body>
</html>
